[package]
name = "voxnest"
version = "0.8.15"
description = "voxNest · 声巢 — 一个完全本地的 VoiceStudio"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
libc = "0.2"
base64 = "0.22"

[lib]
name = "voxnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "voxnest"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = false
opt-level = "s"
strip = false
